[project]
name = "vox-core"
version = "0.1.0"
description = "vox-core — shared measurement infrastructure for the vox tools. Currently: the bass-safe guarded F0 ruler (a low-floor pyworld pass that refuses to trust parselmouth on deep bass, where its failure mode is locking onto a partial and reading high)."
# pyworld ships wheels for CPython 3.8–3.12 only; pin to <3.13 for the wheel.
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pyworld>=0.3.4",
    # pyworld 0.3.5 imports `pkg_resources` at import time; setuptools>=81 removed it.
    "setuptools<81",
]

[project.optional-dependencies]
# parselmouth is optional: without it the ruler degrades to pyworld-only.
praat = ["praat-parselmouth>=0.4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_core"]

[dependency-groups]
dev = ["pytest>=8", "praat-parselmouth>=0.4.3"]
