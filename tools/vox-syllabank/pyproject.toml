[project]
name = "vox-syllabank"
version = "0.1.0"
description = "vox syllabank — a syllable-addressable vocal sample bank with a hard provenance contract: every entry carries source + license or the loader refuses the whole bank. Lookup runs a fallback ladder (exact phones → stressed nucleus → any vowel → any) ranked by F0 hint or duration. v0 seeds only from license-clean self-renders (macOS `say` voices + the shipped voxFof SuperCollider vowels)."
# pyworld ships wheels for CPython 3.8–3.12 only; pin to <3.13 for the wheel.
requires-python = ">=3.10,<3.13"
dependencies = [
    "smplstream",
    "vox-core",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyworld>=0.3.4",
    # pyworld 0.3.5 imports `pkg_resources` at import time; setuptools>=81 removed it.
    "setuptools<81",
    "pronouncing>=0.2.0",
]

[project.optional-dependencies]
# The FOF seed source renders through smpl-synth's NRT bridge (needs SuperCollider too).
fof = ["smpl-synth"]

[project.scripts]
vox-syllabank = "vox_syllabank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_syllabank"]

[tool.uv.sources]
smplstream = { git = "https://github.com/chronick/smpl", subdirectory = "packages/smplstream" }
smpl-synth = { git = "https://github.com/chronick/smpl", subdirectory = "tools/smpl-synth" }
vox-core = { path = "../../packages/vox-core", editable = true }

[dependency-groups]
dev = ["pytest>=8"]
