[project]
name = "vox-dataset"
version = "0.1.0"
description = "vox dataset — the dataset-health doctor. Rubric-scored voicebank-fitness for a directory of clips: per-clip conformance / audio-quality / dryness / guarded-F0 measurements, dataset-level pitch + phone + duration coverage, and a per-target-model rubric (one yaml per voicebank kind) that scores 0-100 with pass/warn/fail + a remediation line per check. faster-whisper is an OPTIONAL import (phone coverage is 'unknown' without transcripts; everything else still scores). Takes the bass-safe guarded-F0 ruler from vox-core; lives in its own isolated venv (<3.13 for the pyworld wheel)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "smplstream",
    "vox-core",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyworld>=0.3.4",
    # pyworld 0.3.5 imports `pkg_resources` at import time; setuptools>=81 removed it.
    "setuptools<81",
    "pronouncing>=0.2.0",
    "pyyaml>=6.0",
]

# faster-whisper is deliberately NOT a hard dependency: transcript-driven phone/syllable
# coverage is optional (the tool degrades to phone-coverage='unknown' when it is absent).
[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
vox-dataset = "vox_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_dataset"]

# The yaml rubric profiles ship inside the package so they resolve after install.
[tool.hatch.build.targets.wheel.force-include]
"src/vox_dataset/profiles" = "vox_dataset/profiles"

# Resolve the unpublished core package from the monorepo for the isolated install.
[tool.uv.sources]
smplstream = { git = "https://github.com/chronick/smpl", subdirectory = "packages/smplstream" }
vox-core = { path = "../../packages/vox-core", editable = true }

[dependency-groups]
dev = ["pytest>=8"]
