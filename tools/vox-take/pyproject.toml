[project]
name = "vox-take"
version = "0.1.0"
description = "vox take — the card-driven render-and-self-verify orchestrator. Reads a take-card YAML (source + render op + a programmed axis coordinate), renders through the sibling voice tools (larynx harmonize/render, flow), measures the result (ear → vector), and reports per-axis error: how far the render landed from the coordinate the card asked for. Composes vox-ear, vox-larynx, vox-vector, and vox-flow as declared dependencies."
# pyworld/parselmouth (via the sibling tools) ship wheels for CPython 3.8–3.12 only.
requires-python = ">=3.10,<3.13"
dependencies = [
    "smplstream",
    "vox-ear",
    "vox-larynx",
    "vox-vector",
    "vox-flow",
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
vox-take = "vox_take.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_take"]

[tool.uv.sources]
smplstream = { git = "https://github.com/chronick/smpl", subdirectory = "packages/smplstream" }
vox-ear = { path = "../vox-ear", editable = true }
vox-larynx = { path = "../vox-larynx", editable = true }
vox-vector = { path = "../vox-vector", editable = true }
vox-flow = { path = "../vox-flow", editable = true }

[dependency-groups]
dev = ["pytest>=8", "scipy>=1.10"]
