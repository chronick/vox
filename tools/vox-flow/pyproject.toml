[project]
name = "vox-flow"
version = "0.1.0"
description = "vox flow — a rhythmic cadence grammar. Percussive vocal delivery as data: a pattern DSL that places syllables on a tempo grid (16th chop, triplet bursts, pushes, swing, accents), renders them spat via `say`, and optionally drives the result through a named ffmpeg chain (grit: band-limit → grid-gate → squash → comb/slap; bass: the same treatment tuned for a deep carrier). Light deps (numpy/soundfile); `say` + `ffmpeg` are system binaries."
requires-python = ">=3.10"
dependencies = [
    "smplstream",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
vox-flow = "vox_flow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_flow"]

[tool.uv.sources]
smplstream = { git = "https://github.com/chronick/smpl", subdirectory = "packages/smplstream" }

[dependency-groups]
dev = ["pytest>=8"]
