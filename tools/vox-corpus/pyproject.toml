[project]
name = "vox-corpus"
version = "0.1.0"
description = "vox corpus — voice-corpus ingest gate. Admits a clip to a voice-conversion matching set (e.g. kNN-VC) only if it (1) peak-normalizes cleanly and (2) survives VAD (steady-state/quiet clips get VADed to nothing downstream and crash the matching set with zero-element reshapes). Uses a torch-free energy-VAD survivability proxy; the authoritative check is the downstream VAD itself. Light deps (numpy/soundfile)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
vox-corpus = "vox_corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_corpus"]

[dependency-groups]
dev = ["pytest>=8"]
