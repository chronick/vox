[project]
name = "vox-bodies"
version = "0.1.0"
description = "vox bodies — a registry of durable, named carrier voices. Each body is an engine + params that render a raw voice-like tone (shipped SuperCollider synthdefs via smpl-synth NRT, or a WORLD re-voicing of a source clip), optionally tagged, with a measured fingerprint (guarded f0, HNR, inharmonicity, spectral shape) written back into the palette yaml."
# pyworld/parselmouth (via vox-core / vox-ear) ship wheels for CPython 3.8–3.12 only.
requires-python = ">=3.10,<3.13"
dependencies = [
    "vox-core",
    "vox-ear",
    "vox-larynx",
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "smpl-synth",
]

[project.scripts]
vox-bodies = "vox_bodies.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_bodies"]

[tool.uv.sources]
smpl-synth = { git = "https://github.com/chronick/smpl", subdirectory = "tools/smpl-synth" }
vox-core = { path = "../../packages/vox-core", editable = true }
vox-ear = { path = "../vox-ear", editable = true }
vox-larynx = { path = "../vox-larynx", editable = true }

[dependency-groups]
dev = ["pytest>=8"]
