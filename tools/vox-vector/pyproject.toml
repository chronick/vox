[project]
name = "vox-vector"
version = "0.1.0"
description = "vox vector — six-axis voice-coordinate measurement (humanness/breathiness/roughness/intelligibility/multiplicity/spatiality), each axis a control coordinate AND a measured quantity, so a programmed trajectory can be diffed against the measured one — render error becomes a number, trajectories become self-verifying. Light deps (numpy/scipy); consumes upstream `vox ear`/`vox larynx` feature frames when present."
requires-python = ">=3.10"
dependencies = [
    "smplstream",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
vox-vector = "vox_vector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_vector"]

[tool.uv.sources]
smplstream = { git = "https://github.com/chronick/smpl", subdirectory = "packages/smplstream" }

[dependency-groups]
dev = ["pytest>=8"]
