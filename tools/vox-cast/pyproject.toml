[project]
name = "vox-cast"
version = "0.1.0"
description = "vox cast — voice conversion through a trained RVC model, as an smpl pipe stage. The tool venv stays light (frames + wav I/O); the heavy ML stack (rvc-python, torch, fairseq) lives in a separate engine venv that `vox cast setup` builds at ~/.vox/engines/rvc. Training is out of scope: bring any Applio/RVC-exported model dir."
requires-python = ">=3.10"
dependencies = [
    "smplstream",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
vox-cast = "vox_cast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_cast"]

[tool.hatch.build.targets.wheel.force-include]
"src/vox_cast/engine-requirements.lock" = "vox_cast/engine-requirements.lock"

[tool.uv.sources]
smplstream = { git = "https://github.com/chronick/smpl", subdirectory = "packages/smplstream" }

[dependency-groups]
dev = ["pytest>=8"]
